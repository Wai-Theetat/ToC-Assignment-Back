services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: TOC
      POSTGRES_PASSWORD: givemeA+please
      POSTGRES_DB: bank_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TOC -d bank_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://TOC:givemeA+please@db:5432/bank_app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
