services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: TOC
      POSTGRES_PASSWORD: givemeA+please
      POSTGRES_DB: bank_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://TOC:givemeA+please@db:5432/bank_app
    depends_on:
      - db

volumes:
  pgdata:
